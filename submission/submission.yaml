additional resources:
- {description: arXiv, location: 'https://arxiv.org/abs/2606.20061'}
comment: A measurement of the correlation between the splitting angle $\theta_{g}$ and the momentum-sharing fraction $z_{g}$ of the first hard splitting in a parton shower in pp collisions and $0–10\%$ central Pb–Pb collisions at $\sqrt{s_{NN}}=5.02$ TeV with the ALICE detector is reported. Charged-particle jets are reconstructed using the anti-kT algorithm with a jet resolution parameter R = 0.2, in the transverse-momentum range $60 \leq p_{\mathrm {T},\mathrm {ch} \, \mathrm {jet}} < 80$ GeV/c. The Soft Drop grooming algorithm is used to identify the first splitting in the parton shower. Jets observed in Pb–Pb collisions are narrower than in pp collisions. This effect is more pronounced for balanced than for unbalanced jets. No significant modification of the momentum-sharing fraction is observed for jets with small opening angles. In contrast, there is a hint that jets with a large opening angle may be less balanced in transverse-momentum in Pb–Pb collisions compared to pp collisions. The correlations between $\theta_{g}$ and $z_{g}$ are well described in the pp collisions by PYTHIA 8 and POWHEG while HERWIG shows too little jets with large opening angle. In Pb–Pb collisions the measurement is compared to a variety of models. The measurement is insensitive to the different implementations of medium response. Inclusion of elastic scatterings, as implemented in the H YBRID model is preferred to describe the unbalanced jets with large $\theta_{g}$ in Pb–Pb collisions. The balanced jets, however, are less sensitive to elastic scatterings. 
